# Projet Xcode décrit pour XcodeGen (choix du développeur) : `xcodegen generate` dans apps/ios produit
# TikTokClone.xcodeproj, qui n'est pas versionné. Relancer la commande après tout ajout ou retrait de fichier.
name: TikTokClone

options:
  bundleIdPrefix: com.sachabouk
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Équipe de signature : DEVELOPMENT_TEAM dans Config/Local.xcconfig (non versionné), pour installer l'app sur un
    # iPhone avec un Apple ID gratuit (« Personal Team »). Le simulateur n'en a pas besoin.
    CODE_SIGN_STYLE: Automatic

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  # Client généré depuis apps/api/openapi.json (ADR-005).
  TikTokAPI:
    path: Packages/TikTokAPI
  # Mesure d'audience et tests A/B (ADR-013). Version figée ; dépendances transitives dans le Package.resolved versionné
  # (TikTokClone.xcodeproj/project.xcworkspace/xcshareddata/swiftpm, ADR-034) : le committer après tout changement.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.85.0
  # Achats de jetons (ADR-009). Dépôt SPM officiel de RevenueCat, plus rapide à résoudre que purchases-ios ; version figée.
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    exactVersion: 5.91.0
  # Live (ADR-053) : SDK officiel de LiveKit (Apache 2.0), pour diffuser et regarder ; version figée.
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.17.0

targets:
  TikTokClone:
    type: application
    platform: iOS
    sources:
      - path: TikTokClone
    dependencies:
      - package: TikTokAPI
      - package: PostHog
      - package: LiveKit
      - package: RevenueCat
    info:
      path: TikTokClone/Info.plist
      properties:
        CFBundleDisplayName: TikTok Clone
        CFBundleDevelopmentRegion: fr
        # Lue par AppConfiguration ; valeur par configuration dans Config/*.xcconfig.
        APIBaseURL: $(API_BASE_URL)
        # Mesure d'audience (ADR-013) : jeton du projet PostHog (vide : événements journalisés seulement) et hôte.
        PostHogProjectToken: $(POSTHOG_PROJECT_TOKEN)
        PostHogHost: $(POSTHOG_HOST)
        # Achats de jetons (ADR-009) : clé publique du SDK RevenueCat (vide : achats indisponibles).
        RevenueCatAPIKey: $(REVENUECAT_API_KEY)
        # Caméra et micro (ADR-052) : filmer des vidéos et des stories. Micro refusé : vidéo sans son.
        NSCameraUsageDescription: Pour filmer tes vidéos et tes stories.
        NSMicrophoneUsageDescription: Pour enregistrer le son de tes vidéos.
        # Écran de lancement noir, comme l'attente de la reprise de session (LaunchView) et le feed.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # En développement, l'API et MinIO sont en HTTP sur le réseau local (localhost, IP du Mac).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        # Lien d'app vers une vidéo : tiktokclone://videos/<id> (partage).
        CFBundleURLTypes:
          - CFBundleURLName: com.sachabouk.tiktokclone
            CFBundleURLSchemes:
              - tiktokclone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sachabouk.tiktokclone
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  TikTokCloneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TikTokCloneTests
    dependencies:
      - target: TikTokClone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sachabouk.tiktokclone.tests

schemes:
  TikTokClone:
    build:
      targets:
        TikTokClone: all
        TikTokCloneTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TikTokCloneTests
